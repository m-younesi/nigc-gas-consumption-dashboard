name: همگام‌سازی با ابر آروان

# هر تغییری روی main - چه پوش دستی، چه ذخیره از پنل مدیریت - باکت
# آبجکت‌استوریج آروان را هم به‌روز می‌کند، تا دو نسخه از هم جدا نیفتند.
on:
  push:
    branches: [main]
  workflow_dispatch:

# گروه با rebuild-downloads مشترک است تا دو ورک‌فلو همزمان روی باکت
# ننویسند. اجرای در حال انجام را نصفه رها نمی‌کنیم، وگرنه باکت ممکن است
# در وضعیت نیمه‌آپلود بماند.
concurrency:
  group: arvan-bucket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: نصب وابستگی‌ها
        run: pip install --quiet boto3

      - name: همگام‌سازی باکت
        env:
          ARVAN_S3_ACCESS_KEY: ${{ secrets.ARVAN_S3_ACCESS_KEY }}
          ARVAN_S3_SECRET_KEY: ${{ secrets.ARVAN_S3_SECRET_KEY }}
          ARVAN_BUCKET: nigc-dashboard
          ARVAN_REGION: ir-thr-at1
        run: python .github/scripts/sync_arvan.py
