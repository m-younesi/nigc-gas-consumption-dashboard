name: بازسازی فایل‌های دانلودی

# وقتی داده یا صفحه‌ها عوض می‌شوند - چه با پوش دستی، چه با ذخیره از پنل
# مدیریت - گزارش PDF، پوستر، پاورپوینت، اکسل و CSV دوباره ساخته می‌شوند
# تا با چیزی که در سایت دیده می‌شود یکی بمانند.
#
# فهرست paths عمداً downloads/** را ندارد: کامیتِ خودِ این ورک‌فلو فقط
# همان پوشه را دست می‌زند، پس خودش را دوباره صدا نمی‌کند.
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/data.js'
      - 'raw_data.json'
      - 'content.json'
      - 'report.html'
      - 'poster.html'
      - 'chart-frame.html'
      - 'assets/js/**.js'
      - 'assets/css/app.css'
      - '.github/build/**'
      - '.github/workflows/rebuild-downloads.yml'
  workflow_dispatch:

# با sync-arvan یک گروه مشترک دارند تا دو ورک‌فلو همزمان روی باکت ننویسند.
concurrency:
  group: arvan-bucket
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4
        with:
          path: webapp

      # اسکریپت‌ها انتظار دارند کنارِ webapp/ در پوشه‌ای به نام build/
      # باشند (ROOT = parents[1])، پس همان چیدمان را می‌سازیم.
      - name: چیدمان پوشه‌ها
        run: |
          mkdir -p build
          cp webapp/.github/build/* build/
          ls -la build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب وابستگی‌ها
        run: |
          pip install --quiet python-pptx openpyxl
          cd build && npm install --silent --no-audit --no-fund

      - name: یافتن کروم
        run: |
          BIN=$(command -v google-chrome || command -v google-chrome-stable \
                || command -v chromium-browser || command -v chromium)
          if [ -z "$BIN" ]; then echo "::error::کروم روی رانر پیدا نشد"; exit 1; fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "کروم: $BIN  ($($BIN --version))"

      # اسکریپت‌های خروجی‌گیری صفحه را با http باز می‌کنند، نه file://
      - name: سرو محلی وب‌اپ
        run: |
          python -m http.server 8765 --directory webapp --bind 127.0.0.1 \
            > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/index.html -o /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/index.html -o /dev/null \
            || { echo "::error::سرور محلی بالا نیامد"; cat /tmp/http.log; exit 1; }

      # dataset.json را از data.js درمی‌آوریم؛ analytics به جدول‌های خام
      # منبع نیاز دارد که در مخزن نیستند، ولی data.js همیشه تازه است.
      - name: استخراج dataset از data.js
        run: python build/extract_dataset.py webapp/assets/js/data.js build/dataset.json

      - name: رندر نمودارها برای اسلایدها
        run: node build/export_charts.js http://127.0.0.1:8765 build/chart_png

      - name: ساخت گزارش PDF
        run: node build/export_pdf.js http://127.0.0.1:8765/report.html webapp/downloads/gas-report-1404.pdf

      - name: ساخت پوستر
        run: node build/export_poster.js http://127.0.0.1:8765/poster.html webapp/downloads/gas-infographic-1404.png

      - name: ساخت پاورپوینت و اکسل و CSV
        run: python build/make_office.py

      - name: گزارش اندازهٔ خروجی‌ها
        run: ls -la webapp/downloads

      - name: کامیت خروجی‌های تغییرکرده
        id: commit
        working-directory: webapp
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "فایل‌های دانلودی تغییری نکردند."
          else
            git commit -m "بازسازی خودکار فایل‌های دانلودی پس از تغییر داده"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # کامیتی که با GITHUB_TOKEN زده شود ورک‌فلوی دیگری را صدا نمی‌زند،
      # پس باکت آروان را همین‌جا خودمان همگام می‌کنیم.
      - name: همگام‌سازی باکت آروان
        if: steps.commit.outputs.changed == 'true'
        working-directory: webapp
        env:
          ARVAN_S3_ACCESS_KEY: ${{ secrets.ARVAN_S3_ACCESS_KEY }}
          ARVAN_S3_SECRET_KEY: ${{ secrets.ARVAN_S3_SECRET_KEY }}
          ARVAN_BUCKET: nigc-dashboard
          ARVAN_REGION: ir-thr-at1
        run: |
          pip install --quiet boto3
          python .github/scripts/sync_arvan.py
